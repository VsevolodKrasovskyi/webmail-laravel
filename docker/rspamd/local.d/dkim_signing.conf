# DKIM keys are written by the Laravel admin panel (app/Observers/DomainObserver.php)
# to the shared /var/dkim volume as <domain>.<selector>.key whenever a domain is created.
selector = "mail";
path = "/var/dkim/$domain.$selector.key";

sign_authenticated = true;
sign_local = true;
use_domain = "header";
allow_username_mismatch = true;
