service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    address = *
    port = 24
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }

  # Postfix SASL authentication over the internal network.
  inet_listener {
    port = 12345
  }
}

service auth-worker {
  user = vmail
}
