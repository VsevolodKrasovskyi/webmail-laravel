disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_master_user_separator = *

# Lets the admin panel open a mailbox's webmail without knowing its real
# password: authenticate as "<mailbox>*admin" using this master password
# instead (see docker/dovecot/master-users.template). Dovecot treats the
# resulting session as the target mailbox for everything else.
passdb {
  driver = passwd-file
  master = yes
  args = scheme=PLAIN /etc/dovecot/master-users
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
